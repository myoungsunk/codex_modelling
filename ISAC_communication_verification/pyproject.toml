[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualpol-rt-phase2"
version = "0.2.0"
description = "Phase 2 realistic dual-polarized shoebox ray-tracing comparison with actual HFSS FFD inputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dualpol_rt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
